<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEMMS Estate Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: minimal Swiss. Hairline top bar; portal = icon side nav + centred work column (max 1240px); supervisor = phone frame beside a short guide. One leaf-green action colour, cherry red only on the brand mark. */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#F0F2EE; --line:#E3E7E1; --line-strong:#CBD2C9;
  --fg:#111813; --muted:#5B675F; --accent:#1F6B47; --accent-hover:#185A3B; --accent-fg:#FFFFFF; --accent-soft:#E5F0E9;
  --cherry:#B23A2B; --cherry-soft:#F8E7E3;
  --ok:#1F6B47; --ok-soft:#E5F0E9; --warn:#8A5A00; --warn-soft:#FBF1D9; --bad:#B42318; --bad-soft:#FCE8E6; --info:#2A5B88; --info-soft:#E5EDF6;
  --paper:#FFFFFF; --ink:#141814; --scrim:rgba(14,20,16,.42); --shadow:rgba(16,32,22,.14);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#151A17; --surface-2:#1C231F; --line:#262F29; --line-strong:#36423A;
  --fg:#E8EDE9; --muted:#9BA79F; --accent:#6CC497; --accent-hover:#84D2A9; --accent-fg:#06140C; --accent-soft:#17301F;
  --cherry:#EA8C7B; --cherry-soft:#3A211C;
  --ok:#6CC497; --ok-soft:#17301F; --warn:#E8B85E; --warn-soft:#33280F; --bad:#F38B80; --bad-soft:#3A1C19; --info:#91B9E3; --info-soft:#18263A;
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#151A17; --surface-2:#1C231F; --line:#262F29; --line-strong:#36423A;
  --fg:#E8EDE9; --muted:#9BA79F; --accent:#6CC497; --accent-hover:#84D2A9; --accent-fg:#06140C; --accent-soft:#17301F;
  --cherry:#EA8C7B; --cherry-soft:#3A211C;
  --ok:#6CC497; --ok-soft:#17301F; --warn:#E8B85E; --warn-soft:#33280F; --bad:#F38B80; --bad-soft:#3A1C19; --info:#91B9E3; --info-soft:#18263A;
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.65rem;letter-spacing:-.025em} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
small{font-size:.8rem}
.mono{font-family:var(--font-mono);font-size:.92em;letter-spacing:-.01em}
.num,td,.kpi .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.spacer{flex:1}
.eyebrow{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.01em}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:14px;height:17px;border-radius:50%;background:var(--cherry);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1.5px;margin-left:-.75px;border-radius:2px;background:var(--surface);transform:rotate(14deg)}
.brand b{font-weight:600;font-size:1rem;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.8rem;padding-left:10px;border-left:1px solid var(--line)}
.tb-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border-radius:10px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow),0 0 0 1px var(--line)}
.clock{display:inline-flex;align-items:center;gap:4px;padding:3px 3px 3px 10px;border:1px solid var(--line);border-radius:10px;font-size:.85rem;background:var(--surface)}
.clock b{font-weight:500;margin-right:4px}
.clock .btn{border:0;padding:4px 8px;height:28px;background:var(--surface-2)}
.banner{padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Controls */
select,input[type=text],input[type=number],input[type=search]{font:inherit;font-size:.92rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;height:36px;min-width:0;max-width:100%;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
select{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select:hover,input:hover{border-color:var(--muted)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{width:7.5em}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:500;color:var(--muted);min-width:0}
.f > select,.f > input{color:var(--fg)}
.f > b{color:var(--fg);font-size:.92rem;font-weight:500;line-height:36px}
.alert .btn{height:30px;padding:0 12px;font-size:.82rem;border-color:var(--line)}
.chip.zero{background:transparent;color:var(--muted);padding-left:2px}
.chip.zero::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.btn{font:inherit;font-size:.88rem;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:0 14px;height:36px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--bad);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--bad-soft)}
.btn-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;text-align:left}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Portal */
.portal{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 100px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:60px;align-self:start;height:calc(100vh - 100px);overflow-y:auto}
.side button{border:0;background:none;text-align:left;font:inherit;font-size:.9rem;color:var(--muted);padding:0 10px;height:38px;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.side button:hover{background:var(--surface-2);color:var(--fg)}
.side button[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.side button[aria-current="page"] .ico{color:var(--accent)}
.side .label{flex:1}
.side .count{font-size:.72rem;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-2);color:var(--fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.main{padding-block:32px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:24px;max-width:1288px;width:100%}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-h p{color:var(--muted);max-width:68ch;margin-top:6px}
@media (max-width:900px){
  .portal{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:4px}
  .side button{white-space:nowrap;flex:none}
  .main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:20px}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.kpi .v{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi .v small{font-size:.85rem;font-weight:400}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:20px}
.tbl-wrap{overflow-x:auto;min-width:0;margin-inline:-4px}
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th{text-align:left;font-weight:500;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
table.data td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td.mono,table.data td.r{white-space:nowrap}
.r{text-align:right!important}
tr.click{cursor:pointer}
tr.click td{transition:background-color .12s var(--ease)}
tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:.76rem;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.ok,.chip.warn,.chip.bad,.chip.info{background:transparent;color:var(--fg);padding-left:2px}
.chip.ok::before,.chip.warn::before,.chip.bad::before,.chip.info::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
.chip.ok::before{background:var(--ok)} .chip.warn::before{background:var(--warn)} .chip.bad::before{background:var(--bad)} .chip.info::before{background:var(--info)}
.chip.bad{color:var(--bad)}
.chip.cherry{background:var(--cherry-soft);color:var(--cherry)}
button.chip{border:1px solid var(--line);cursor:pointer;font-family:var(--font-mono);background:var(--surface);color:var(--fg);padding:3px 9px}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.barrow{display:flex;align-items:center;gap:10px;min-width:120px}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.alerts .alert:last-child{border-bottom:0}
.alert::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;align-self:flex-start;margin-top:7px}
.alert.bad::before{background:var(--bad)} .alert.warn::before{background:var(--warn)} .alert.ok::before{background:var(--ok)}
.alert div{min-width:0;flex:1}
.alert b{font-weight:500}
.main > .alert{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.guide-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.guide-list li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted);max-width:75ch}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .bar-r{fill:var(--accent);opacity:.85}
.chart .bar-t{fill:var(--cherry)}
.chart .grid{stroke:var(--line);stroke-width:1}

/* Step guides */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px;counter-reset:step}
.steps li{counter-increment:step;display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);font-size:.86rem;line-height:1.45;color:var(--muted)}
.steps li::before{content:counter(step);width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.75rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px;font-variant-numeric:tabular-nums}
.steps li b{color:var(--fg);font-weight:600;font-size:.9rem}

/* Attendance register */
input[type=date]{font:inherit;font-size:.92rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;height:36px}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);border:1px solid transparent}
.bulk.idle{background:var(--surface-2)}
.bulk.idle b{color:var(--muted);font-weight:500}
.bulk b{font-weight:600}
.bulk .sep{width:1px;align-self:stretch;background:var(--line-strong)}
table.reg td{vertical-align:middle;padding-block:8px}
table.reg select{max-width:200px}
table.reg tr.sel td{background:var(--accent-soft)}
.seg4{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--surface-2)}
.seg4 button{width:34px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg4 button:hover{color:var(--fg)}
.seg4 button.on-P{background:var(--accent);color:var(--accent-fg)}
.seg4 button.on-H{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.seg4 button.on-A,.seg4 button.on-L{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.seg4 button[disabled]{cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{border:1px solid var(--line);border-radius:8px;padding:4px 5px;min-height:56px;display:flex;flex-direction:column;gap:1px;font-size:.72rem;min-width:0;background:var(--surface)}
.cal-d b{font-size:.85rem;line-height:1.1}
.cal-d small{font-size:.64rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-d.st-P{background:var(--accent-soft);border-color:transparent}
.cal-d.st-P b{color:var(--ok)}
.cal-d.st-H{background:var(--warn-soft);border-color:transparent}
.cal-d.st-H b{color:var(--warn)}
.cal-d.st-A,.cal-d.st-L{background:var(--bad-soft);border-color:transparent}
.cal-d.st-A b,.cal-d.st-L b{color:var(--bad)}

/* Processing board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{display:flex;flex-direction:column;gap:10px;min-height:140px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;font-size:.85rem;padding:0 2px 8px;border-bottom:1px solid var(--line)}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;width:100%;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.bcard:hover{border-color:var(--line-strong);box-shadow:0 4px 14px -8px var(--shadow)}
.bcard .code{font-family:var(--font-mono);font-weight:500;font-size:.88rem}

/* Drawer */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px var(--shadow);animation:slide .22s var(--ease)}
.drawer .panel{background:var(--bg);border-color:var(--line)}
.drawer-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:1.2rem;margin-top:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.timeline{display:flex;flex-direction:column;border-left:1px solid var(--line-strong);margin-left:5px}
.tl{position:relative;padding:0 0 16px 18px}
.tl::before{content:"";position:absolute;left:-6px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong)}
.tl.done::before{background:var(--accent);border-color:var(--accent)}
.tl.live::before{border-color:var(--warn);background:var(--warn-soft)}
.tl b{font-weight:500}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .15s var(--ease)}
.opt:hover{border-color:var(--line-strong)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt b{font-weight:500}
.opt input{margin-top:3px}
.msg{font-size:.86rem;padding:10px 12px;border-radius:var(--r-sm);background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* Labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.label-card{background:var(--paper);color:var(--ink);border:1px solid #D8DCD6;border-radius:var(--r-sm);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:.78rem;line-height:1.4}
.label-card .code{font-family:var(--font-mono);font-size:1.05rem;font-weight:500}
.label-card .est{font-weight:600;font-size:.9rem;letter-spacing:-.01em}

/* ---------- Batch helpers ---------- */
function stageTargetH(b,key){
  if(key==='PULPING') return 6;
  if(key==='FERMENTATION') return RECIPE[b.recipe].hours;
  if(key==='QUALITY_CHECK') return 24;
  return (S.settings.dry[key]||14)*24;
}
function stageYield(b,key){
  if(key==='PULPING') return 0.58;
  if(key==='FERMENTATION') return 0.97;
  if(key==='FLOOR_DRYING') return 0.36;
  if(key==='TRAY_DRYING') return b.route==='A' ? 0.36 : 0.46;
  if(key==='NATURAL_TRAY_DRYING') return 0.45;
  return 1;
}
const bInKg = b=>sum(b.inputs,i=>i.kg);
const curStage = b=>b.stages[b.stages.length-1];
function bOutKg(b){ const c=curStage(b); return c && c.status==='COMPLETED' && c.key==='QUALITY_CHECK' ? c.outKg : 0; }
const bAvail = b=>r3(bOutKg(b)-b.packedKg);
function bStatus(b){
  const c = curStage(b);
  if(!c) return 'PLANNED';
  if(c.status==='IN_PROGRESS') return c.key==='QUALITY_CHECK' ? 'AWAITING_QC' : 'ACTIVE';
  if(c.key==='QUALITY_CHECK'){ if(b.packedKg<=0.001) return 'READY'; return bAvail(b)<=0.001 ? 'PACKED' : 'PART_PACKED'; }
  return 'ACTIVE';
}
function boardCol(b){ const s=bStatus(b); if(s==='READY'||s==='PART_PACKED') return 'READY'; if(s==='PACKED') return null; return curStage(b).key; }
function lastReading(st,metric){ for(let i=st.readings.length-1;i>=0;i--) if(st.readings[i].metric===metric) return st.readings[i]; return null; }
function batchMoisture(b){ for(let i=b.stages.length-1;i>=0;i--){ const r=lastReading(b.stages[i],'MOISTURE'); if(r) return r; } return null; }
function isOverdue(st){ return st.status==='IN_PROGRESS' && st.key!=='QUALITY_CHECK' && toMs(S.now)>toMs(st.plannedEnd); }
function readingDue(st){ if(st.status!=='IN_PROGRESS' || !STAGE[st.key].dry) return false; const r=lastReading(st,'MOISTURE'); return hoursBetween(r?r.at:st.start, S.now) > 30; }
function procLabel(b){
  if(b.route==='C') return 'Natural, tray dried';
  if(b.route==='B') return 'Fermented ('+b.recipe+' '+RECIPE[b.recipe].name+'), tray dried';
  const d = b.stages.find(s=>s.key==='FLOOR_DRYING'||s.key==='TRAY_DRYING');
  return 'Pulped'+(d ? ', '+(d.key==='FLOOR_DRYING'?'floor':'tray')+' dried' : '');
}
function lotUsed(code){ return sum(S.batches, b=>sum(b.inputs.filter(i=>i.lot===code), i=>i.kg)); }
const lotAvail = l=>r1(l.accepted-lotUsed(l.code));
function batchHarvestDates(b){ const ds=new Set(); for(const i of b.inputs){ const l=lotBy(i.lot); for(const id of l.entries) ds.add(musterBy(id).date); } return [...ds].sort(); }
function nextTray(kgIn){
  const n = Math.max(1, Math.ceil(kgIn/80));
  const start = (S.seq.tray % 40) + 1; S.seq.tray += n;
  const end = ((start-1+n-1) % 40) + 1;
  return n===1 ? 'Tray '+start : (end>start ? 'Trays '+start+'–'+end : 'Trays '+start+'–40, 1–'+end);
}
function resFor(key,kgIn){
  if(key==='PULPING') return 'Pulper P1';
  if(key==='FERMENTATION'){ S.seq.tank=(S.seq.tank+1)%TANKS.length; return 'Tank '+TANKS[S.seq.tank]; }
  if(key==='FLOOR_DRYING'){ S.seq.yard=(S.seq.yard+1)%YARDS.length; return 'Floor yard '+YARDS[S.seq.yard]; }
  if(STAGE[key].dry) return nextTray(kgIn);
  return '';
}
function busyTanks(){ const set=new Set(); for(const b of S.batches){ const c=curStage(b); if(c && c.status==='IN_PROGRESS' && c.key==='FERMENTATION') set.add(c.res.replace('Tank ','')); } return set; }

/* ---------- Traceability: proportional shares through every link ---------- */
function traceSources(sources){
  const T = {dates:{}, subs:{}, vars:{}, workers:{}, batches:{}, lots:{}, entries:new Set(), total:0};
  for(const s of sources){
    const b = batchBy(s.batch); const tin = bInKg(b);
    add(T.batches, b.code, s.kg); T.total += s.kg;
    for(const inp of b.inputs){
      const lot = lotBy(inp.lot); const k1 = s.kg*inp.kg/tin;
      add(T.lots, lot.code, k1);
      for(const id of lot.entries){
        const e = musterBy(id); const k = k1*e.net/lot.received;
        add(T.dates, e.date, k); add(T.subs, e.sub, k); add(T.vars, e.variety, k); add(T.workers, e.worker, k); T.entries.add(id);
      }
    }
  }
  return T;
}
function bagLabel(bag){
  const T = traceSources(bag.sources);
  const dates = Object.keys(T.dates).sort();
  const divs = [...new Set(Object.keys(T.subs).map(s=>DIV[SUB[s].div].name))];
  const vars = Object.keys(T.vars).map(v=>VARIETY[v]);
  return {T, dates, divs, vars};
}

/* ---------- Packing: fill bags in order, or mix every batch into every bag ---------- */
function buildBags(batches, bagKg, count, mode){
  const total = sum(batches,b=>b.kg); const out = [];
  if(mode==='even'){
    for(let i=0;i<count;i++) out.push({kg:bagKg, sources:batches.filter(b=>b.kg>0).map(b=>({batch:b.code, kg:r3(bagKg*b.kg/total)}))});
  } else {
    const q = batches.map(b=>({code:b.code, left:b.kg})); let qi = 0;
    for(let i=0;i<count;i++){
      let need = bagKg; const src = [];
      while(need>1e-6 && qi<q.length){
        const take = Math.min(need, q[qi].left);
        if(take>1e-6){ src.push({batch:q[qi].code, kg:r3(take)}); q[qi].left -= take; need -= take; }
        if(q[qi].left<=1e-6) qi++;
      }
      out.push({kg:bagKg, sources:src});
    }
  }
  return out;
}
function createPack(o){
  const e = o.estate; const n = ++S.seq.pack[e];
  const code = 'PL-'+e+'-2026-'+pad(n,4);
  const bags = buildBags(o.batches, o.bagKg, o.count, o.mode);
  const pfx = ESTATE[e].prefix+o.grade;
  bags.forEach(bag=>{ S.seq.bag[pfx] = (S.seq.bag[pfx]||10)+1; bag.code = pfx+S.seq.bag[pfx]; bag.lot = code; });
  for(const bag of bags) for(const s of bag.sources){ const b=batchBy(s.batch); b.packedKg = r3(b.packedKg+s.kg); }
  const first = batchBy(o.batches[0].code);
  const lot = {code, estate:e, at:o.at, grade:o.grade, bagType:o.bagType, bagKg:o.bagKg, mode:o.mode, route:first.route, process:procLabel(first), bags, by:'Packing staff (sample)'};
  S.packs.push(lot);
  return lot;
}
const allBags = ()=>S.packs.flatMap(p=>p.bags);
const bagBy = code=>allBags().find(b=>b.code===code);
const packBy = code=>S.packs.find(p=>p.code===code);

function makeWash(e, d, at, ids, R, fl, rj){
  const entries = ids.map(id=>S.muster.find(m=>m.id===id));
  const received = r1(sum(entries,m=>m.net));
  const floaters = fl!=null ? fl : r1(received*(0.025+R()*0.015));
  const rejected = rj!=null ? rj : r1(received*(0.01+R()*0.01));
  const code = 'WL-'+e+'-2026-'+pad(++S.seq.wash[e],4);
  entries.forEach(m=>{ m.washLot = code; });
  const lot = {code, estate:e, date:d, at, entries:ids, received, floaters, rejected, accepted:r1(received-floaters-rejected), by:'Processing operator (sample)'};
  S.wash.push(lot);
  return lot;
}
function simBatch(e, p, R){
  const lots = p.lots.map(x=>S.wash.find(w=>w.estate===e && w.date==='2026-10-'+x));
  const code = 'B-'+e+'-2026-'+pad(++S.seq.batch[e],4);
  const b = {code, estate:e, route:p.route, recipe:p.recipe||'', inputs:lots.map(l=>({lot:l.code, kg:l.accepted})), stages:[], packedKg:0, createdAt:''};
  let t = lots[lots.length-1].date+'T14:00'; b.createdAt = t;
  let kgIn = bInKg(b); let key = ROUTE[p.route].first;
  while(key){
    const tgt = stageTargetH(b,key);
    let actual = tgt;
    if(STAGE[key].dry && p.dryH) actual = p.dryH;
    if(key==='QUALITY_CHECK') actual = 20;
    const st = {key, start:t, plannedEnd:addH(t,tgt), end:'', inKg:r1(kgIn), outKg:0, res:resFor(key,kgIn), readings:[], status:'IN_PROGRESS', by:key==='QUALITY_CHECK'?'':'Processing operator (sample)'};
    const end = addH(t,actual);
    seedReadings(st, b, end, p.slow, R);
    b.stages.push(st);
    if(key==='QUALITY_CHECK' && p.holdQC) break;
    if(toMs(end)>toMs(S.now)) break;
    st.end = end; st.status = 'COMPLETED'; st.outKg = r1(kgIn*stageYield(b,key));
    if(key==='QUALITY_CHECK'){ st.decision='APPROVED'; st.by='Quality officer (sample)'; }
    kgIn = st.outKg; t = end;
    const nx = ROUTE[p.route].next[key];
    key = nx.length ? (nx.length>1 ? (p.branch==='FLOOR'?'FLOOR_DRYING':'TRAY_DRYING') : nx[0]) : null;
  }
  S.batches.push(b); IDX.batch.set(b.code,b);
  return b;
}
function seedReadings(st, b, endAt, slow, R){
  const until = Math.min(toMs(endAt), toMs(S.now)); const H = hoursBetween(st.start, st.plannedEnd) || 1;
  if(STAGE[st.key].dry){
    const k = 4.99/H*(slow||1);
    for(let h=12; toMs(addH(st.start,h))<=until; h+=24) st.readings.push({at:addH(st.start,h), metric:'MOISTURE', value:r1(Math.max(10.6, 11+44*Math.exp(-k*h)+(R()-.5)*0.3)), by:'sample'});
    if(toMs(endAt)<=toMs(S.now)) st.readings.push({at:endAt, metric:'MOISTURE', value:r1(Math.max(10.8, 11+44*Math.exp(-k*hoursBetween(st.start,endAt)))), by:'sample'});
  } else if(st.key==='FERMENTATION'){
    for(let h=6; toMs(addH(st.start,h))<=until; h+=12){
      const f = Math.min(1,h/H);
      st.readings.push({at:addH(st.start,h), metric:'PH', value:r2(5.4-1.2*f+(R()-.5)*.08), by:'sample'});
      st.readings.push({at:addH(st.start,h), metric:'TEMP', value:r1(23+(R()-.5)*2), by:'sample'});
    }
  } else if(st.key==='QUALITY_CHECK'){
    const m = batchMoisture(b); if(m) st.readings.push({at:st.start, metric:'MOISTURE', value:m.value, by:'sample'});
  }
}

/* ---------- Field app writes and sync ---------- */
function fieldWrite(label){
  const m = {id:'Q'+(++S.seq.q), at:S.now, label};
  if(S.field.online){ S.log.unshift(Object.assign({synced:S.now}, m)); S.field.lastSync = S.now; }
  else S.queue.push(m);
  S.log = S.log.slice(0,25);
  return S.field.online ? 'synced' : 'pending';
}
function syncNow(){
  if(!S.field.online) return;
  for(const k in S.att) for(const r of Object.values(S.att[k].rows)) if(r.sync==='pending') r.sync='synced';
  for(const k in S.att) if(S.att[k].sync==='pending') S.att[k].sync='synced';
  for(const m of S.muster) if(m.sync==='pending') m.sync='synced';
  for(const q of S.queue) S.log.unshift(Object.assign({synced:S.now}, q));
  S.log = S.log.slice(0,25); S.queue = []; S.field.lastSync = S.now;
}

/* One attendance sheet per estate per day, shared by the supervisor phone and the portal register.

function prevAssignment(e,d,wid){
  const prev = Object.values(S.att).filter(s=>s.estate===e && s.date<d && s.rows[wid] && s.rows[wid].job).sort((a,b)=>a.date<b.date?1:-1)[0];
  return prev ? prev.rows[wid] : null;
}
function newRow(e,d,wid){
  const r = prevAssignment(e,d,wid);

  const div = r && DIV[r.div] && DIV[r.div].active!==false ? r.div : (f0?f0.code:'');

  S.att[e+'|'+d] = {estate:e, date:d, status:'DRAFT', supervisor:ESTATE[e].sup, source:source||'phone', rows, submittedAt:''};

}

function alerts(es){

function dailyChart(rows){
  const W=600, H=170, L=40, B=22, T=10; const n=rows.length; const max=Math.max(100, ...rows.map(r=>r.kg));
  const top = Math.ceil(max/200)*200; const bw=(W-L-8)/n;
  const y = v=>T+(H-T-B)*(1-v/top);
  const ticks = [0, top/2, top];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net cherry kilograms plucked per day">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${nf1.format(t)}</text>`).join('')}
    ${rows.map((r,i)=>`<rect class="${i===n-1?'bar-t':'bar-r'}" x="${L+i*bw+1.5}" y="${y(r.kg)}" width="${Math.max(1,bw-3)}" height="${(H-T-B)-(y(r.kg)-T)}" rx="2"><title>${fd(r.d)}: ${kg(r.kg)}</title></rect>${((i%3===0&&n-1-i>=2)||i===n-1)?`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${fds(r.d)}</text>`:''}`).join('')}
  </svg>`;
}

function readFieldForm(){ const v=id=>(document.getElementById(id)||{}).value; return {name:v('fd-name')||'', acres:v('fd-acres')||'', exp:v('fd-exp')||0, elev:v('fd-elev')||'', act:v('fd-act')||'1', est:v('fd-e')}; }
function readSubs(){ return S.ui.drawer.subs.map((s,i)=>({code:s.code, land:document.getElementById('sd-land-'+i).value, variety:document.getElementById('sd-var-'+i).value, acres:parseFloat(document.getElementById('sd-ac-'+i).value)||0})); }
function saveFieldForm(){
  const d = S.ui.drawer; d.form = readFieldForm(); if(d.form.est) d.estate = d.form.est; d.subs = readSubs(); d.err = ''; const err = t=>{ d.err = t; return false; };
  const name = document.getElementById('fd-name').value.trim(); const acres = num('#fd-acres');
  const subs = d.subs.filter(s=>s.acres>0);
  if(!name) return err('Give the field a name.');
  const e = d.code ? DIV[d.code].estate : (document.getElementById('fd-e') ? document.getElementById('fd-e').value : d.estate);
  if(DIVS.some(x=>x.estate===e && x.code!==d.code && x.name.toLowerCase()===name.toLowerCase())) return err('Another field in this estate already has that name.');
  if(acres<=0) return err('Enter the total acres.');
  if(!subs.length) return err('Add at least one subdivision with acres.');
  if(Math.abs(sum(subs,s=>s.acres)-acres)>0.001) return err(`Subdivisions add up to ${sum(subs,s=>s.acres)} acres, but the field is ${acres} acres. Make them match.`);

  let f = d.code ? DIV[d.code] : null;

function moistureSpark(st){
  const rs = st.readings.filter(r=>r.metric==='MOISTURE'); if(rs.length<2) return '';
  const W=480,H=96,L=30,B=14; const t0=toMs(st.start), t1=Math.max(toMs(rs[rs.length-1].at), toMs(st.plannedEnd));
  const x = t=>L+(W-L-6)*((toMs(t)-t0)/(t1-t0)); const y = v=>6+(H-6-B)*(1-(v-8)/(60-8));
  const lim = S.settings.mMax;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Moisture readings">
    <line class="grid" x1="${L}" x2="${W-4}" y1="${y(lim)}" y2="${y(lim)}" stroke-dasharray="3 3"/><text x="${L-4}" y="${y(lim)+3}" text-anchor="end">${lim}%</text>
    <text x="${L-4}" y="${y(55)+3}" text-anchor="end">55%</text>
    <polyline points="${rs.map(r=>x(r.at)+','+y(r.value)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>

}

function dPack(d){

  const e = d.estate || (pre?pre.estate:(ready[0]?ready[0].estate:es[0]));
  const list = ready.filter(b=>b.route===route && b.estate===e);
  const type = d.bagType || 'GUNNY';

  return dHead('New packed lot', ESTATE[e].short) + `
  <div class="formgrid">

  },
  pe(){ const el=document.getElementById('pe-net'); if(!el) return; const n=r1(num('#pe-g')-num('#pe-t')); el.textContent = num('#pe-g')>0 ? (n>0?kg(n):'Check bag weight') : '–'; },
  fd(){ const el=document.getElementById('fd-prev'); if(!el||!S.ui.drawer||S.ui.drawer.type!=='field') return; const t=sum(S.ui.drawer.subs.map((s,i)=>parseFloat((document.getElementById('sd-ac-'+i)||{}).value)||0)); const a=num('#fd-acres'); el.textContent='Subdivisions: '+t+' of '+a+' acres'+(Math.abs(t-a)>0.001?' (should match)':''); },
  pk(){
    const el = document.getElementById('pk-prev'); if(!el) return;
    const picks = [...document.querySelectorAll('input[name=pk-b]:checked')].map(x=>({code:x.value, kg:Math.min(num('#pk-kg-'+x.value), bAvail(batchBy(x.value)))})).filter(p=>p.kg>0);

    const b=batchBy(el.dataset.v); const c=curStage(b); const out=r1(num('#cs-out')); if(out<=0) return;
    c.status='COMPLETED'; c.end=S.now; c.outKg=out;
    const nx=ROUTE[b.route].next[c.key]; const sel=document.getElementById('cs-next'); const key=sel?sel.value:nx[0];
    const st={key, start:S.now, plannedEnd:addH(S.now, stageTargetH(b,key)), end:'', inKg:out, outKg:0, res:resFor(key,out), readings:[], status:'IN_PROGRESS', by:key==='QUALITY_CHECK'?'':'Processing operator'};
    if(key==='QUALITY_CHECK'){ const m=batchMoisture(b); if(m) st.readings.push({at:S.now, metric:'MOISTURE', value:m.value, by:'carried from drying'}); }
    b.stages.push(st);
  },
  qcApprove(el){ const b=batchBy(el.dataset.v); const c=curStage(b); c.status='COMPLETED'; c.end=S.now; c.outKg=c.inKg; c.decision='APPROVED'; c.by='Quality officer'; },
  qcRework(el){ const b=batchBy(el.dataset.v); const c=curStage(b); const prevDry=[...b.stages].reverse().find(s=>STAGE[s.key].dry); c.status='COMPLETED'; c.end=S.now; c.outKg=c.inKg; c.decision='Sent back for more drying'; c.by='Quality officer';
    b.stages.push({key:prevDry.key, start:S.now, plannedEnd:addH(S.now,48), end:'', inKg:c.inKg, outKg:0, res:prevDry.res, readings:[], status:'IN_PROGRESS', by:'Processing operator'}); },
  newPack(el){ S.ui.drawer={type:'pack', batch:el.dataset.v||''}; if(S.ui.mode!=='portal') S.ui.mode='portal'; },
  savePack(){
    const picks=[...document.querySelectorAll('input[name=pk-b]:checked')].map(x=>({code:x.value, kg:Math.min(num('#pk-kg-'+x.value), bAvail(batchBy(x.value)))})).filter(p=>p.kg>0);
    const size=num('#pk-size'), count=Math.floor(num('#pk-count')); const total=sum(picks,p=>p.kg);
    if(!picks.length || count<1 || count*size>total+1e-6) return;
    const mode=document.querySelector('input[name=pk-mode]:checked').value; const grade=document.getElementById('pk-grade').value; const type=document.getElementById('pk-type').value;
    const lot=createPack({estate:batchBy(picks[0].code).estate, at:S.now, grade, bagType:type, bagKg:size, count, mode, batches:picks});
    S.ui.drawer={type:'packLot', code:lot.code}; S.ui.page='packing';
  },
  openPack(el){ S.ui.drawer={type:'packLot', code:el.dataset.v}; },
  trace(el){ S.ui.traceQ=el.dataset.v; S.ui.page='trace'; S.ui.drawer=null; S.ui.mode='portal'; },
  saveSettings(){ for(const k of ['FLOOR_DRYING','TRAY_DRYING','NATURAL_TRAY_DRYING']) S.settings.dry[k]=+document.getElementById('set-'+k).value; S.settings.mMin=num('#set-mmin'); S.settings.mMax=num('#set-mmax'); S.ui.flash='Saved. New drying stages use these targets.'; }
};
const CHANGE = {
  estate(el){ S.ui.estate=el.value; S.ui.drawer=null; S.field.draft.worker=''; S.field.assign=null; S.field.msg=''; },
  asDiv(el){ const sh=sheetOf(fEst(),today()); const r=sh.rows[el.dataset.w]; r.div=el.value; const bs=bearingSubs(DIV[r.div]); r.sub=bs[0]?bs[0].code:''; const jobEl=document.getElementById('as-job'); if(jobEl) r.job=jobEl.value; },
  muWorker(el){ const dr=S.field.draft; dr.worker=el.value; const sh=sheetOf(fEst(),today()); const r=sh.rows[el.value]; dr.div=r.div; dr.sub=r.sub; S.field.msg=''; },
  muDiv(el){ const dr=S.field.draft; dr.div=el.value; const bs=bearingSubs(DIV[dr.div]); dr.sub=bs[0]?bs[0].code:''; },
  muSub(el){ S.field.draft.sub=el.value; },
  pluckDate(el){ S.ui.pluckDate=el.value; },
  attEstate(el){ S.ui.attEstate=el.value; S.ui.attSel={}; S.ui.attFlash=''; },
  attDate(el){ if(el.value && el.value>=SEASON_START && el.value<=today()){ S.ui.attDate=el.value; S.ui.attSel={}; S.ui.attFlash=''; } },
  attSel(el){ S.ui.attSel=S.ui.attSel||{}; S.ui.attSel[el.dataset.w]=el.checked; S.ui.attFlash=''; },
  attSelAll(el){ const sh=attSheet(); S.ui.attSel={}; if(el.checked) for(const w of Object.keys(sh.rows)) S.ui.attSel[w]=true; S.ui.attFlash=''; },
  attField(el){ const r=attSheet().rows[el.dataset.w]; r.div=el.value; r.sub=''; S.ui.attFlash=''; },
  attJob(el){ attSheet().rows[el.dataset.w].job=el.value; S.ui.attFlash=''; },
  attRemark(el){ attSheet().rows[el.dataset.w].remark=el.value; },
  histWorker(el){ S.ui.histWorker=el.value; },
  plEstate(el){ S.ui.plEstate=el.value; },
  plDate(el){ if(el.value && el.value>=SEASON_START && el.value<=today()) S.ui.plDate=el.value; },
  peWorker(el){ const pe=S.ui.pe; pe.worker=el.value; const sh=sheetOf(plEstate(),plDate()); pe.div=sh.rows[el.value].div; pe.sub=''; pe.msg=''; },
  peDiv(el){ S.ui.pe.div=el.value; S.ui.pe.sub=''; S.ui.pe.msg=''; },
  peSub(el){ S.ui.pe.sub=el.value; },
  fdEstate(el){ const d=S.ui.drawer; d.form=readFieldForm(); d.subs=readSubs(); d.estate=el.value; },
  publicView(el){ S.ui.publicView=el.checked; },
  nbRoute(el){ S.ui.drawer.route=el.value; },
  nbEstate(el){ S.ui.drawer.estate=el.value; },
  pkEstate(el){ const d=S.ui.drawer; d.estate=el.value; d.route=''; d.batch=''; },
  pkRoute(el){ const d=S.ui.drawer; d.route=el.value; d.batch=''; },
  pkType(el){ S.ui.drawer.bagType=el.value; }
};

document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  ev.preventDefault();
  if(el.dataset.act!=='reset') S.ui.resetArmed=false;
  fn(el); render(); runLive();
});
document.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-change]');
  if(el && CHANGE[el.dataset.change]){ CHANGE[el.dataset.change](el); render(); runLive(); return; }
  const lv = ev.target.closest('[data-live]'); if(lv && LIVE[lv.dataset.live]) LIVE[lv.dataset.live]();
});
document.addEventListener('input', ev=>{
  const lv = ev.target.closest('[data-live]'); if(!lv) return;
  if(lv.id==='pk-count') lv.dataset.auto='0';
  if(lv.id && lv.id.startsWith('pk-kg-')){ const c=document.getElementById('pk-count'); if(c) c.dataset.auto='1'; }
  if(LIVE[lv.dataset.live]) LIVE[lv.dataset.live]();
});
document.addEventListener('submit', ev=>{
  const f = ev.target.closest('[data-submit]'); if(!f) return; ev.preventDefault();
  if(f.dataset.submit==='trace'){ S.ui.traceQ=document.getElementById('tr-q').value; render(); }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && S.ui.drawer){ S.ui.drawer=null; render(); } });
function runLive(){
  const d = S.ui.drawer; if(!d) return;
  if(d.type==='field') LIVE.fd(); if(d.type==='wash') LIVE.wash(); if(d.type==='newBatch') LIVE.nb(); if(d.type==='pack') LIVE.pk();
}
function drawQRs(){
  document.querySelectorAll('.qr[data-text]').forEach(el=>{
    if(el.dataset.done) return; el.dataset.done='1';
    try{ if(window.QRCode){ new window.QRCode(el,{text:el.dataset.text, width:84, height:84, colorDark:'#000000', colorLight:'#ffffff', correctLevel:window.QRCode.CorrectLevel.M}); return; } }catch(e){}
    el.innerHTML = '<small class="mono">'+esc(el.dataset.text.replace('CEMMS-BAG:',''))+'</small>';
  });
}

/* ---------- Start ---------- */
S = load();
if(!S) seed(); else reindex();
const tok = (location.hash||'').replace('#','');
if(tok==='field') S.ui.mode='field';
else if(PAGES.some(p=>p[0]===tok)){ S.ui.mode='portal'; S.ui.page=tok; }
render();
})();
</script>
